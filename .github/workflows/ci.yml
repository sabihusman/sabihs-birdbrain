name: CI

on:
  push:
    branches-ignore: ['gh-pages']
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium's
    # system dependencies ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Server maintenance scripts (fake tree, no docker)
        run: bash scripts/server/test.sh
      - name: Build (model from the local server, so CI never downloads from the API host)
        run: npm run build
        env:
          VITE_MODEL_BASE_URL: /models/birdnet-v2.4/
          # Usage counts on, sent to the preview server itself; the e2e test catches them (DECISIONS.md #120).
          VITE_POSTHOG_KEY: phc_e2e_not_a_real_key
          VITE_POSTHOG_HOST: /__usage
      - name: Build must not contain the BirdNET weights (DECISIONS.md #56)
        run: npm run check:dist
      # BirdNET+ V3.0 (admin test, DECISIONS.md #133): the weights are not in git (174 MB), so they come from Zenodo once
      # and then from the Actions cache; the script checks them against models/birdnet-v3.0/SHA256SUMS.
      - name: Cache the BirdNET+ V3.0 weights
        uses: actions/cache@v4
        with:
          path: |
            models/birdnet-v3.0/audio.onnx
            models/birdnet-v3.0/geo.onnx
          key: birdnet-v3.0-${{ hashFiles('models/birdnet-v3.0/SHA256SUMS') }}
      - name: Fetch the BirdNET+ V3.0 weights for its end-to-end test
        run: bash scripts/fetch-model-v3.sh
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (loads model, runs inference on the BirdNET sample clip)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The API's own checks on every push and pull request, not only on main (server-image.yml): an unused import in a
  # server test once passed the PR checks and then stopped the deploy at lint (Nov 20, DECISIONS.md #129).
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
