name: CI

on:
  push:
    branches-ignore: ['gh-pages']
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium's
    # system dependencies ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Server maintenance scripts (fake tree, no docker)
        run: bash scripts/server/test.sh
      - name: Build (model from the local server, so CI never downloads from the API host)
        run: npm run build
        env:
          VITE_MODEL_BASE_URL: /models/birdnet-v2.4/
      - name: Build must not contain the BirdNET weights (DECISIONS.md #56)
        run: npm run check:dist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (loads model, runs inference on the BirdNET sample clip)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
